group = "com.lyokone.location"
version = "1.0-SNAPSHOT"

buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.3.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.23"
        classpath "org.jlleitschuh.gradle:ktlint-gradle:11.5.0"
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "org.jlleitschuh.gradle.ktlint"

android {
    namespace = "com.lyokone.location"
    compileSdk = 35

    defaultConfig {
        minSdk = 21
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        allWarningsAsErrors = true
    }
}

dependencies {
    compileOnly "androidx.annotation:annotation:1.6.0"

    // Flutter embedding dependencies for compilation
    compileOnly files("${System.getenv('FLUTTER_SDK') ?: '/opt/homebrew/share/flutter'}/bin/cache/artifacts/engine/android-arm/flutter.jar")

    api "com.google.android.gms:play-services-location:21.2.0"
    implementation "androidx.core:core-ktx:1.10.1"

    // Test dependencies
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.11.1"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation "org.mockito:mockito-core:5.3.1"
    testImplementation "org.mockito:mockito-inline:5.2.0"
    testImplementation "org.jetbrains.kotlin:kotlin-test:1.9.23"
    testImplementation files("${System.getenv('FLUTTER_SDK') ?: '/opt/homebrew/share/flutter'}/bin/cache/artifacts/engine/android-arm/flutter.jar")
}
